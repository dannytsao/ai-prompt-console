<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Private Endpoint</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #94a3b8;
    }
    .box {
      text-align: center;
      padding: 24px;
      border: 1px solid #1e293b;
      border-radius: 12px;
      background: #111827;
    }
    .title {
      color: #f8fafc;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">🔒 Private Endpoint</div>
    <div class="sub">Access Restricted</div>
  </div>
</body>
</html>
